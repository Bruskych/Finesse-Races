pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

// Подключаем соседний проект-api
includeFlat 'remedy-core-1-20-x'

rootProject.name = 'finesse-races-1-20-x'
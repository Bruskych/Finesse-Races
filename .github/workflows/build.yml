# Name
name: Build Forge 1.20.1

# Push = Start check
on: [push, pull_request]

jobs:
  build:
    # Server
    runs-on: ubuntu-latest

    steps:
      # Download main mod code (folder: main-mod)
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main-mod

      # Download private API core (folder: remedy-core-1-20-x)
      - name: Checkout remedy-core
        uses: actions/checkout@v4
        with:
          repository: Bruskych/remedy-core   # Private repo link
          path: remedy-core-1-20-x           # Folder name for includeFlat
          token: ${{ secrets.API_TOKEN }}    # Secret access key

      # Download Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configuring Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run the gradlew build file (TRUE) in main-mod folder
      - name: Make Gradle wrapper executable
        run: cd main-mod && chmod +x ./gradlew

      # Start mod compilation (.jar file) in main-mod folder
      - name: Build with Gradle
        run: cd main-mod && ./gradlew build
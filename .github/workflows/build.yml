# Name
name: Build Forge 1.20.1

# Push = Start check
on: [push, pull_request]

jobs:
  build:
    # Server
    runs-on: ubuntu-latest

    steps:
      # Download code in server
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # Download commits history (ALL)
          fetch-tags: true    # Download tags

      # Download Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configuring Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run the gradlew build file (TRUE)
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Start mod compilation (.jar file)
      - name: Build with Gradle
        run: ./gradlew build